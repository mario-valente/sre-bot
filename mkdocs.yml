site_name: SRE Bot
site_url: https://mario-valente.github.io/sre-bot
site_description: AI-powered SRE assistant for autonomous incident triage and root cause analysis
site_author: Mario Valente

repo_name: Mario-Valente/sre-bot
repo_url: https://github.com/Mario-Valente/sre-bot

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mermaid2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonitions
  - pymdownx.details
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Configuration: configuration.md
  - User Guide:
    - Architecture: architecture.md
    - Learning System: learning-system.md
    - API Reference: api-reference.md
  - Deployment:
    - Helm Chart: helm-chart.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mario-Valente/sre-bot

copyright: Copyright &copy; 2024 Mario Valente
